; CTRL-04L · prueba de hardware · XIAO ESP32-C3 + OLED 0,96" I2C + 2 sliders B103 + 4 botones + 2 tiras NeoPixel
[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
; Serial por el USB nativo del ESP32-C3
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel
    olikraus/U8g2
